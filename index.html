<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>20x20 Grid</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f3f3f3;
      font-family: Arial, sans-serif;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(20, 20px);
      grid-template-rows: repeat(20, 20px);
      gap: 2px;
      background: #999;
      padding: 2px;
    }

    .cell {
      width: 20px;
      height: 20px;
      background: white;
    }
  </style>
</head>
<body>
  <div class="grid">
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <!-- repeat this 400 times -->
  </div>
</body>
</html>
