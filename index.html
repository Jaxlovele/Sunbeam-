<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake!</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            background: #f1e9e9;
            font-family: Arial, sans-serif;
            padding: 20px;
            box-sizing: border-box;
        }

        h1, p {
            text-align: center;
            color: #333;
        }

        /* 1. Header Grid Container */
        .grid-container {  
            position: relative;
            width: 100%;
            max-width: 440px;
            margin-bottom: 30px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .grid-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* 2. Visual Grid Overlay Effect */
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
        }

        .grid-cell {
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        /* Game Container Styling */
        .game {
           text-align: center;
           color: #333;
           margin-top: 10px;
        }

        .score {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(20, 20px);
            grid-template-rows: repeat(20, 20px);
            gap: 2px;
            background: #222;
            padding: 8px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
        }

        .cell {
            width: 20px;
            height: 20px;
            background: #1d1d1d;
            border-radius: 3px;
        }

        .snake {
            background: #00ff00;
        }

        .food {
            background: #ff0000;
        }
    </style>
</head>
<body>

    <h1>Let's start!</h1>
    <p>Welcome to the Snake Game! In this game you will be able to control the snake and eat food to grow longer and earn points!</p>

    <!-- Header Section with visual grid overlay -->
    <div class="grid-container">  
        
        <div class="grid-overlay">
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        </div>
    </div>

    <!-- Snake Game Section -->
    <div class="game">
        <div class="score">Score: <span id="score">0</span></div>
        <div class="board" id="grid"></div>
        <button id="resetBtn" style="margin-top: 20px; padding: 10px 20px; font-size: 16px; cursor: pointer;">Reset Game</button>
    </div>


    <script>
        const boardSize = 20; 
        const gridElement = document.getElementById("grid"); 
        const scoreEl = document.getElementById("score");
    
        let snake = [
          { x: 10, y: 10 },
          { x: 9, y: 10 },
          { x: 8, y: 10 }
        ];

        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let food = { x: 15, y: 10 };
        let gameOver = false;
        let score = 0;
    
        
        // FIXED: Renamed to clear up confusion and avoid innerHTML crashes
        function buildBoard() {
          gridElement.innerHTML = "";
          for (let i = 0; i < boardSize * boardSize; i++) {
            const cell = document.createElement("div");
            cell.classList.add("cell");
            gridElement.appendChild(cell);
          }
        }

        function draw() {
          const cells = Array.from(document.querySelectorAll(".cell"));

          cells.forEach(cell => {
            cell.classList.remove("snake", "food");
          });

          snake.forEach(segment => {
            const index = segment.y * boardSize + segment.x;
            if (cells[index]) cells[index].classList.add("snake");
          });

          const foodIndex = food.y * boardSize + food.x;
          if (cells[foodIndex]) cells[foodIndex].classList.add("food");
        }

        function randomFood() {
          let newFood;
          do {
            newFood = {
              x: Math.floor(Math.random() * boardSize),
              y: Math.floor(Math.random() * boardSize)
            };
          } while (snake.some(segment => segment.x === newFood.x && segment.y === newFood.y));

          food = newFood;
        }

        function resetGame() {
          snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
          ];
          direction = { x: 1, y: 0 };
          nextDirection = { x: 1, y: 0 };
          food = { x: 15, y: 10 };
          gameOver = false;
          score = 0;
          scoreEl.textContent = "0";
          draw();
        }

        function moveSnake() {
          if (gameOver) return;

          direction = nextDirection;
          const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

          // Wall collision
          if (head.x < 0 || head.x >= boardSize || head.y < 0 || head.y >= boardSize) {
            gameOver = true;
            alert("Game Over!");
            return;
          }

          // Self collision
          if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
            gameOver = true;
            alert("Game Over!");
            return;
          }

          snake.unshift(head);

          // Eat food
          if (head.x === food.x && head.y === food.y) {
            score += 10;
            scoreEl.textContent = score;
            randomFood();
          } else {
            snake.pop();
          }

          draw();
        }

        // FIXED: Captured standard camel-case arrow key strings
        document.addEventListener("keydown", (event) => {
          if (gameOver) return;

          const key = event.key; 

          // Prevent the browser arrow keys from scrolling the webpage up/down while trying to play
          if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(key)) {
            event.preventDefault();
          }

          // FIXED Case Sensitivity: "ArrowUp" instead of "arrowup"
          if (key === "ArrowUp" || key.toLowerCase() === "w") {
            if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
          } else if (key === "ArrowDown" || key.toLowerCase() === "s") {
            if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
          } else if (key === "ArrowLeft" || key.toLowerCase() === "a") {
            if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
          } else if (key === "ArrowRight" || key.toLowerCase() === "d") {
            if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
          }
        });

        document.getElementById("resetBtn").addEventListener("click", resetGame);

        buildBoard();
        draw();
        setInterval(moveSnake, 120);
    </script>
</body>
</html>
